<article>
<p>照片在左边，右边是你自己写的标注。这是这个站的核心。</p>
<p class="memory-date">下面是三个示例，用来展示版式。等你把照片发给我，我会按同样的样子换成你真实的记忆。</p>
<figure class="memory">
<div class="photo-slot">照片位 · 等你上传</div>
<figcaption>
<span class="memory-date">2024 年 冬</span>
<p>示例标注：写这张照片里发生了什么、当时在想什么、照片里的人是谁。两三句话就够，不用写成完整的文章。</p>
</figcaption>
</figure>
<figure class="memory">
<div class="photo-slot">照片位 · 等你上传</div>
<figcaption>
<span class="memory-date">2023 年 夏</span>
<p>示例标注：第二张。标注可以是说明，也可以是一句当时的心情，甚至只是一句话点出这是什么东西。</p>
</figcaption>
</figure>
<figure class="memory">
<div class="photo-slot">照片位 · 等你上传</div>
<figcaption>
<span class="memory-date">2021 年 秋</span>
<p>示例标注：第三张。照片按时间从近到远排列，新的在最上面。</p>
</figcaption>
</figure>
